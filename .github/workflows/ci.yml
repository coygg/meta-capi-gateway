name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint, tests, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, pdo, pdo_sqlite, pcov
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer config
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP files
        run: composer lint

      - name: Run unit tests
        run: composer test:unit

      - name: Run full suite with 100% coverage gate
        run: composer test:coverage -- --missing
